openapi: 3.1.0
info:
  title: Aria AI API
  version: 1.0.0-bootstrap
  description: >-
    Sprint 1 contract baseline. Product paths are added only with their approved
    story, authorization rules, implementation, and contract tests.
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      servers:
        - url: /
      operationId: getLiveness
      summary: Report whether the API process is alive
      security: []
      responses:
        "200":
          description: The API process is alive. No dependency is probed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /health/ready:
    get:
      servers:
        - url: /
      operationId: getReadiness
      summary: Report whether the API is ready to receive traffic
      description: >-
        Checks startup configuration, database connectivity, and the
        Redis-compatible queue binding. AI providers are deliberately excluded.
      security: []
      responses:
        "200":
          description: The API is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: A critical internal dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
components:
  parameters:
    AccountContextHeader:
      name: X-Account-ID
      in: header
      required: true
      description: >-
        Selects the Account context. The server authorizes the authenticated
        identity against an active Membership before accepting the context.
      schema:
        type: string
        format: uuid
  responses:
    AccountContextRequired:
      description: The Account context header is missing, empty, or not a UUID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: ACCOUNT_CONTEXT_REQUIRED
              message: A valid account context is required.
              retryable: false
            meta:
              request_id: 00000000-0000-0000-0000-000000000000
    MembershipRequired:
      description: The identity does not have an active Membership for the context.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: MEMBERSHIP_REQUIRED
              message: An active account membership is required.
              retryable: false
            meta:
              request_id: 00000000-0000-0000-0000-000000000000
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment, version, release_commit_sha]
      properties:
        status: { type: string, const: alive }
        service: { type: string, const: aria-api }
        environment: { type: string, enum: [local, test, staging, production] }
        version: { type: string }
        release_commit_sha:
          type: [string, "null"]
          pattern: "^[0-9a-fA-F]{40}$"
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment, version, release_commit_sha, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        service: { type: string, const: aria-api }
        environment: { type: string, enum: [local, test, staging, production] }
        version: { type: string }
        release_commit_sha:
          type: [string, "null"]
          pattern: "^[0-9a-fA-F]{40}$"
        checks:
          type: object
          additionalProperties: false
          required: [configuration, database, queue]
          properties:
            configuration: { type: string, const: pass }
            database: { type: string, enum: [pass, fail] }
            queue: { type: string, enum: [pass, fail] }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
            retryable: { type: boolean }
        meta:
          type: object
          additionalProperties: false
          required: [request_id]
          properties:
            request_id: { type: string, format: uuid }
