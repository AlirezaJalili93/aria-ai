[project]
name = "aria-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "alembic==1.19.0",
  "aria-observability",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "pyjwt[crypto]==2.13.0",
  "sqlalchemy[asyncio]==2.0.51",
  "uvicorn[standard]==0.52.3",
]

[tool.uv.sources]
aria-observability = { path = "../../packages/observability" }

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/observability/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
