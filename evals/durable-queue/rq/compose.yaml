name: aria-rq-queue-eval

services:
  redis:
    image: redis:7-alpine
    environment:
      QUEUE_EVAL_REDIS_PASSWORD: ${QUEUE_EVAL_REDIS_PASSWORD:?required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${QUEUE_EVAL_REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:16381:6379"
    volumes:
      - queue-eval-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${QUEUE_EVAL_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 1s
      timeout: 1s
      retries: 30

  queue-eval-worker:
    build:
      context: .
    environment: &candidate-environment
      QUEUE_EVAL_REDIS_PASSWORD: ${QUEUE_EVAL_REDIS_PASSWORD:?required}
      QUEUE_EVAL_JOB_MONITORING_INTERVAL_SECONDS: "1"
      QUEUE_EVAL_MAINTENANCE_INTERVAL_SECONDS: "1"
      QUEUE_EVAL_WORKER_TTL_SECONDS: "16"
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "queue_eval.worker"]
    stop_grace_period: 2s

  probe:
    build:
      context: .
    environment: *candidate-environment
    entrypoint: ["python", "-m", "queue_eval.cli"]
    depends_on:
      redis:
        condition: service_healthy
    profiles: [tools]

volumes:
  queue-eval-redis-data:
