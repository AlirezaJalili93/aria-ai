# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Budget ceiling target: USD 24/month, subject to the instance types confirmed at creation.
services:
  - type: keyvalue
    name: aria-staging-queue
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: aria-staging-api
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install uv==0.12.5 && uv sync --project apps/api --locked --no-dev
    startCommand: uv run --project apps/api --no-sync uvicorn app.main:create_app --factory --app-dir apps/api --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_VERSION
        value: 0.1.0
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_APP_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QUEUE_BROKER_URL
        fromService:
          type: keyvalue
          name: aria-staging-queue
          property: connectionString
      - key: STORAGE_ENDPOINT
        value: https://hqgfqlvfwflbazsuhazs.storage.supabase.co/storage/v1/s3
      - key: STORAGE_BUCKET
        value: aria-staging-project-content
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: AUTH_PROVIDER_URL
        value: https://hqgfqlvfwflbazsuhazs.supabase.co/auth/v1
      - key: AUTH_JWKS_URL
        value: https://hqgfqlvfwflbazsuhazs.supabase.co/auth/v1/.well-known/jwks.json
      - key: AUTH_AUDIENCE
        value: authenticated
      - key: RELEASE_COMMIT_SHA
        fromService:
          type: web
          name: aria-staging-api
          envVarKey: RENDER_GIT_COMMIT

  - type: worker
    name: aria-staging-worker
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install uv==0.12.5 && uv sync --project apps/worker --locked --no-dev
    startCommand: cd apps/worker && uv run --no-sync python -m app.main
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_VERSION
        value: 0.1.0
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: QUEUE_BROKER_URL
        fromService:
          type: keyvalue
          name: aria-staging-queue
          property: connectionString
      - key: STORAGE_ENDPOINT
        value: https://hqgfqlvfwflbazsuhazs.storage.supabase.co/storage/v1/s3
      - key: STORAGE_BUCKET
        value: aria-staging-project-content
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: RELEASE_COMMIT_SHA
        fromService:
          type: worker
          name: aria-staging-worker
          envVarKey: RENDER_GIT_COMMIT
